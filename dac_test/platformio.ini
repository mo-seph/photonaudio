; MCP4728 DAC test for the LED driver - standalone, not the Peripheral firmware.
; See README.md for wiring.

[platformio]
default_envs = xiao-c6

[env]
framework = arduino
monitor_speed = 115200
; Echo typed characters locally and send LF on Enter, so the firmware never echoes.
monitor_echo = yes
monitor_eol = LF
lib_deps =
    adafruit/Adafruit MCP4728@^1.0.10

; ESP32-C6 needs arduino-esp32 v3.x. The official PlatformIO espressif32 platform (6.x)
; only offers ESP-IDF for C6 boards, so this uses the pioarduino fork, pinned to
; release 55.03.312 = arduino-esp32 3.3.12 / ESP-IDF 5.5.5 (first verified build, 2026-10-22).
[env:xiao-c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = seeed_xiao_esp32c6
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DI2C_SDA_PIN=D4    ; XIAO D4
    -DI2C_SCL_PIN=D5    ; XIAO D5

; Same sketch on the XIAO ESP32-S3, matching the I2CElectronics platform pin
; (arduino-esp32 2.0.17), as a cross-check that the code builds on both.
[env:xiao-s3]
platform = espressif32 @ 6.9.0
platform_packages =
    framework-arduinoespressif32 @ ==3.20017.0
board = seeed_xiao_esp32s3
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DI2C_SDA_PIN=5     ; XIAO D4
    -DI2C_SCL_PIN=6     ; XIAO D5

; The PCB's wiring on a XIAO ESP32-S3 (2026-11-06): the DAC on the S3's second hardware
; I2C controller (Wire1) at D0 / D1, plus a stand-in network slave on Wire at D4 / D5
; (0x13, answering 0xAA like I2CElectronics' peripheral-s3-test), so both controllers run
; at once, as they will in the Peripheral firmware.
[env:xiao-s3-board]
extends = env:xiao-s3
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DDAC_ON_WIRE1
    -DI2C_SDA_PIN=1     ; XIAO D0 = SDA_DAC
    -DI2C_SCL_PIN=2     ; XIAO D1 = SCL_DAC
    -DNET_SLAVE_ADDR=0x13
    -DNET_SDA_PIN=5     ; XIAO D4 = SDA_NET
    -DNET_SCL_PIN=6     ; XIAO D5 = SCL_NET

; XIAO ESP32-C3 with the PCB's DAC wiring (D0 / D1, 220 R series, 10k pull-ups), 2026-11-06.
; The C3 has only one I2C controller (no Wire1), so this runs the DAC on Wire and has no
; network slave: it checks the wiring and the DAC, not the S3's second controller.
[env:xiao-c3]
platform = espressif32 @ 6.9.0
platform_packages =
    framework-arduinoespressif32 @ ==3.20017.0
board = seeed_xiao_esp32c3
build_flags =
    -DI2C_SDA_PIN=D0    ; XIAO D0 = GPIO2
    -DI2C_SCL_PIN=D1    ; XIAO D1 = GPIO3

; Adafruit HUZZAH32 ESP32 Feather (original ESP32). USB goes through a USB-serial chip,
; so no USB-CDC flag. Uses the Feather's labelled SDA/SCL pins.
[env:feather-esp32]
platform = espressif32 @ 6.9.0
platform_packages =
    framework-arduinoespressif32 @ ==3.20017.0
board = featheresp32
build_flags =
    -DI2C_SDA_PIN=23    ; Feather pin labelled SDA
    -DI2C_SCL_PIN=22    ; Feather pin labelled SCL



